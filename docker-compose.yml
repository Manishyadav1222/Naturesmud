services:
  # ── MySQL Database ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: naturesmud_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-natures_mud}
      MYSQL_USER: ${DB_USERNAME:-naturesmud}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    command: --default-authentication-plugin=mysql_native_password --sort_buffer_size=4M
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - naturesmud
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: naturesmud_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - naturesmud
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Meilisearch ────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: naturesmud_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKey}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    networks:
      - naturesmud

  # ── Laravel Backend ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: naturesmud_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - backend_storage:/var/www/html/storage/app/public:rw
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-natures_mud}
      DB_USERNAME: ${DB_USERNAME:-naturesmud}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY:-masterKey}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
    ports:
      - "8000:80"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - naturesmud

  # ── Admin Server (Node.js) ─────────────────────────────────────
  admin-server:
    build:
      context: ./admin-server
      dockerfile: Dockerfile
    container_name: naturesmud_admin_server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://${DB_USERNAME:-naturesmud}:${DB_PASSWORD:-secret}@mysql:3306/natures_mud_admin
      LARAVEL_DB_HOST: mysql
      LARAVEL_DB_PORT: 3306
      LARAVEL_DB_USER: ${DB_USERNAME:-naturesmud}
      LARAVEL_DB_PASSWORD: ${DB_PASSWORD:-secret}
      LARAVEL_DB_DATABASE: ${DB_DATABASE:-natures_mud}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtsecretkey_naturemud_min_32_chars_1234567890}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-supersecretjwtrefreshsecretkey_naturemud_min_32_chars_1234567890}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001,http://localhost,http://127.0.0.1:3000,http://127.0.0.1:3001,http://localhost:8000}
    ports:
      - "4000:4000"
      - "4001:4000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - naturesmud

  # ── Next.js Frontend ───────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naturesmud_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:80/api}
      NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-http://localhost:4000/api/admin}
      INTERNAL_ADMIN_API_URL: ${INTERNAL_ADMIN_API_URL:-http://admin-server:4000/api/admin}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
    ports:
      - "3001:3000"
    depends_on:
      - backend
      - admin-server
    networks:
      - naturesmud

  # ── Nginx (production reverse proxy) ───────────────────────────
  nginx:
    image: nginx:alpine
    container_name: naturesmud_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - naturesmud

  # ── Laravel Horizon Queue Worker ───────────────────────────────
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: naturesmud_horizon
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    # Code is baked into the image, no source bind-mount needed in prod
    # volumes:
    #   - ./backend:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-natures_mud}
      DB_USERNAME: ${DB_USERNAME:-naturesmud}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - naturesmud

volumes:
  mysql_data:
  redis_data:
  meili_data:
  backend_storage:

networks:
  naturesmud:
    driver: bridge