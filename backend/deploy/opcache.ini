; ── OPcache production tuning for Windows bind-mount performance ──
; Disables file timestamp validation to avoid re-statting every vendor
; file on the slow Windows Docker bind mount. PHP-FPM caches compiled
; files in shared memory until restart (docker restart naturesmud_backend).

opcache.enable=1
opcache.enable_cli=1

; Keep compiled PHP files in memory - do NOT re-stat filesystem
; on every request (this is what makes Windows bind mounts 10x slower)
opcache.validate_timestamps=0
opcache.revalidate_freq=0

opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
opcache.max_wasted_percentage=5

; Serve cached files directly from memory without filesystem checks
opcache.enable_file_override=1

; Fast shutdown + JIT for even better performance
opcache.fast_shutdown=1
opcache.jit_buffer_size=64M
opcache.jit=tracing