name: Production Deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            # Navigate to the deployment directory
            cd /var/www/natures-mud

            echo "=== Deployment started at $(date) ==="

            # Pull the latest code
            echo "Pulling latest code..."
            git pull origin main

            # Load environment variables
            if [ -f .env ]; then
              export $(grep -v '^#' .env | xargs)
            fi

            # Run the backup script before rebuilding (optional safety net)
            echo "Running database backup..."
            bash deploy/backup.sh || echo "Warning: Backup failed, continuing..."

            # Build and push images to registry (if using registry)
            # docker-compose build

            # Pull latest images (if using registry)
            # docker-compose pull

            # Rebuild and restart Docker containers
            echo "Rebuilding and starting containers..."
            docker-compose build --no-cache
            docker-compose up -d --remove-orphans

            # Wait for health checks
            echo "Waiting for services to be healthy..."
            sleep 30

            # Verify services are running
            echo "Checking service health..."
            docker-compose ps

            # Clean up old unused images to save space
            echo "Cleaning up old images..."
            docker image prune -af --filter "until=24h"

            echo "=== Deployment completed at $(date) ==="

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
            # Add notification (Slack, Discord, Email, etc.)
          else
            echo "❌ Deployment failed!"
            # Add notification for failure
          fi
