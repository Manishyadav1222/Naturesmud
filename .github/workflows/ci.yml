name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'
  PHP_VERSION: '8.3'

jobs:
  # Next.js Frontend Check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint Frontend
        run: npm run lint
      - name: Type Check Frontend
        run: npx tsc --noEmit
      - name: Build Frontend
        run: npm run build
      # - name: Run Frontend Tests
      #   run: npm run test

  # Laravel Backend Check
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: natures_mud_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
        ports: [3306]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, bcmath, mysql, redis, pdo_mysql
          coverage: xdebug
      - name: Install dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Copy env file
        run: cp .env.example .env.testing
      - name: Generate app key
        run: php artisan key:generate --env=testing
      - name: Run database migrations
        run: php artisan migrate --env=testing --force
      - name: Run Tests
        run: php artisan test --coverage --min=50
      - name: Static Analysis
        run: php artisan code:analyse || true

  # Admin Server Check
  admin-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin-server
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: natures_mud_admin_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
        ports: [3306]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: mysql://test:test@localhost:3306/natures_mud_admin_test
      - name: Type Check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # - name: Run Tests
      #   run: npm run test

  # Docker Build Check
  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend, backend, admin-server]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: naturesmud-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Admin Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-server
          file: ./admin-server/Dockerfile
          load: true
          tags: naturesmud-admin:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: naturesmud-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
